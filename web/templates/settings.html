{% extends 'base.html' %}
{% block title %}Настройки{% endblock %}
{% block content %}
<div class="header-row"><h1>Настройки</h1></div>
<div class="card">
  <form method="post" action="/web/settings/save" class="stack-form">
    <label>
      Количество дней для последних отчетов
      <input type="number" min="1" max="365" name="latest_reports_days" value="{{ latest_reports_days }}">
    </label>

    <div class="actions-row">
      <button type="submit">Сохранить</button>
    </div>
  </form>
</div>
<div class="card"><table><thead><tr><th>Ключ</th><th>Значение</th><th>Обновлено</th></tr></thead><tbody>{% for row in settings_rows %}<tr><td>{{ row.key }}</td><td>{{ row.value }}</td><td>{{ row.updated_at }}</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
